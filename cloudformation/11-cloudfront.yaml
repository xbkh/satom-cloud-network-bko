AWSTemplateFormatVersion: '2010-09-09'
Description: Distribution du portail et politiques de cache Léman Finance.
Parameters:
  AlbDns: {Type: String}
  OriginDomainOverride: {Type: String, Default: ''}
  OriginHeader: {Type: String, NoEcho: true}
  PortalAlias: {Type: String, Default: ''}
  CertificateUsEast1: {Type: String, Default: ''}
  CloudFrontWebAclArn: {Type: String, Default: ''}
  OriginProtocol:
    Type: String
    Default: http-only
    AllowedValues: [http-only, https-only]
  Enabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
Conditions:
  CustomAlias: !And [!Not [!Equals [!Ref PortalAlias, '']], !Not [!Equals [!Ref CertificateUsEast1, '']]]
  OriginOverride: !Not [!Equals [!Ref OriginDomainOverride, '']]
  Active: !Equals [!Ref Enabled, 'true']
  HasWebAcl: !Not [!Equals [!Ref CloudFrontWebAclArn, '']]
Resources:
  StaticCache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: statique-portail-leman-bko
        DefaultTTL: 86400
        MaxTTL: 86400
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags: [{Key: Name, Value: d-leman-portail-bko}, {Key: Equipe, Value: bko}, {Key: Projet, Value: SatomCloudNetwork}]
      DistributionConfig:
        Comment: d-leman-portail-bko
        Enabled: !If [Active, true, false]
        WebACLId: !If [HasWebAcl, !Ref CloudFrontWebAclArn, !Ref 'AWS::NoValue']
        PriceClass: PriceClass_100
        Aliases: !If [CustomAlias, [!Ref PortalAlias], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - CustomAlias
          - {AcmCertificateArn: !Ref CertificateUsEast1, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021}
          - {CloudFrontDefaultCertificate: true}
        Origins:
          - Id: portail-alb
            DomainName: !If [OriginOverride, !Ref OriginDomainOverride, !Ref AlbDns]
            OriginCustomHeaders: [{HeaderName: X-Leman-Origin, HeaderValue: !Ref OriginHeader}]
            CustomOriginConfig:
              OriginProtocolPolicy: !Ref OriginProtocol
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: portail-alb
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: !If [OriginOverride, b689b0a8-53d0-40ab-baf2-68738e2966ac, 216adef6-5c7f-47e4-b989-5492eafa07d3]
        CacheBehaviors:
          - PathPattern: '/static/*'
            TargetOriginId: portail-alb
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: !Ref StaticCache
            Compress: true
          - PathPattern: '/api/*'
            TargetOriginId: portail-alb
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !If [OriginOverride, b689b0a8-53d0-40ab-baf2-68738e2966ac, 216adef6-5c7f-47e4-b989-5492eafa07d3]
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
        CustomErrorResponses:
          - {ErrorCode: 500, ErrorCachingMinTTL: 0}
          - {ErrorCode: 502, ErrorCachingMinTTL: 0}
          - {ErrorCode: 503, ErrorCachingMinTTL: 0}
          - {ErrorCode: 504, ErrorCachingMinTTL: 0}
Outputs:
  DistributionId: {Value: !Ref Distribution}
  DomainName: {Value: !GetAtt Distribution.DomainName}
