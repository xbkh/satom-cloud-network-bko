AWSTemplateFormatVersion: '2010-09-09'
Description: Distribution du portail et politiques de cache Léman Finance.
Parameters:
  AlbDns: {Type: String}
  OriginDomainOverride: {Type: String, Default: ''}
  OriginHeader: {Type: String, NoEcho: true}
  PortalAlias: {Type: String, Default: ''}
  CertificateUsEast1: {Type: String, Default: ''}
  CloudFrontWebAclArn: {Type: String, Default: ''}
  NameSuffix: {Type: String, Default: bko, AllowedPattern: '[a-z0-9-]+'}
  Environnement: {Type: String, Default: prod, AllowedValues: [dev, prod]}
  StaticOriginMode:
    Type: String
    Default: alb
    AllowedValues: [alb, prepare-s3, s3]
  StaticContentKmsKeyArn:
    Type: String
    Default: alias/aws/s3
    AllowedPattern: 'alias/aws/s3|arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+'
  EnableCacheMetrics:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  OriginProtocol:
    Type: String
    Default: http-only
    AllowedValues: [http-only, https-only]
  Enabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
Rules:
  PrivateStaticNeedsKey:
    RuleCondition: !Not [!Equals [!Ref StaticOriginMode, alb]]
    Assertions:
      - Assert: !Not [!Equals [!Ref StaticContentKmsKeyArn, alias/aws/s3]]
        AssertDescription: Une clé KMS est requise pour préparer ou utiliser le bucket privé.
Conditions:
  CustomAlias: !And [!Not [!Equals [!Ref PortalAlias, '']], !Not [!Equals [!Ref CertificateUsEast1, '']]]
  OriginOverride: !Not [!Equals [!Ref OriginDomainOverride, '']]
  Active: !Equals [!Ref Enabled, 'true']
  HasWebAcl: !Not [!Equals [!Ref CloudFrontWebAclArn, '']]
  PrepareStaticBucket: !Not [!Equals [!Ref StaticOriginMode, alb]]
  ServeStaticFromBucket: !Equals [!Ref StaticOriginMode, s3]
  PublishCacheMetrics: !Equals [!Ref EnableCacheMetrics, 'true']
Resources:
  StaticBucket:
    Type: AWS::S3::Bucket
    Condition: PrepareStaticBucket
    Properties:
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref StaticContentKmsKeyArn
            BucketKeyEnabled: true
      Tags:
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: bko}
        - {Key: Environnement, Value: !Ref Environnement}
        - {Key: Module, Value: '11'}
  StaticOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: PrepareStaticBucket
    Properties:
      OriginAccessControlConfig:
        Name: !Sub oac-statique-leman-${NameSuffix}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: PrepareStaticBucket
    Properties:
      Bucket: !Ref StaticBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${StaticBucket.Arn}/static/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  StaticCache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub statique-portail-leman-${NameSuffix}
        DefaultTTL: 86400
        MaxTTL: 86400
        MinTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - {Key: Name, Value: !Sub 'd-leman-portail-${NameSuffix}'}
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: bko}
        - {Key: Environnement, Value: !Ref Environnement}
        - {Key: Module, Value: '11'}
      DistributionConfig:
        Comment: !Sub d-leman-portail-${NameSuffix}
        Enabled: !If [Active, true, false]
        WebACLId: !If [HasWebAcl, !Ref CloudFrontWebAclArn, !Ref 'AWS::NoValue']
        PriceClass: PriceClass_100
        Aliases: !If [CustomAlias, [!Ref PortalAlias], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - CustomAlias
          - {AcmCertificateArn: !Ref CertificateUsEast1, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021}
          - {CloudFrontDefaultCertificate: true}
        Origins:
          - Id: portail-alb
            DomainName: !If [OriginOverride, !Ref OriginDomainOverride, !Ref AlbDns]
            OriginCustomHeaders: [{HeaderName: X-Leman-Origin, HeaderValue: !Ref OriginHeader}]
            CustomOriginConfig:
              OriginProtocolPolicy: !Ref OriginProtocol
              OriginSSLProtocols: [TLSv1.2]
          - !If
            - PrepareStaticBucket
            - Id: portail-statique
              DomainName: !GetAtt StaticBucket.RegionalDomainName
              OriginAccessControlId: !Ref StaticOriginAccess
              S3OriginConfig: {OriginAccessIdentity: ''}
            - !Ref 'AWS::NoValue'
        DefaultCacheBehavior:
          TargetOriginId: portail-alb
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: !If [OriginOverride, b689b0a8-53d0-40ab-baf2-68738e2966ac, 216adef6-5c7f-47e4-b989-5492eafa07d3]
        CacheBehaviors:
          - PathPattern: '/static/*'
            TargetOriginId: !If [ServeStaticFromBucket, portail-statique, portail-alb]
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: !Ref StaticCache
            Compress: true
          - PathPattern: '/api/*'
            TargetOriginId: portail-alb
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: !If [OriginOverride, b689b0a8-53d0-40ab-baf2-68738e2966ac, 216adef6-5c7f-47e4-b989-5492eafa07d3]
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
        CustomErrorResponses:
          - {ErrorCode: 500, ErrorCachingMinTTL: 0}
          - {ErrorCode: 502, ErrorCachingMinTTL: 0}
          - {ErrorCode: 503, ErrorCachingMinTTL: 0}
          - {ErrorCode: 504, ErrorCachingMinTTL: 0}
  CacheMetrics:
    Type: AWS::CloudFront::MonitoringSubscription
    Condition: PublishCacheMetrics
    Properties:
      DistributionId: !Ref Distribution
      MonitoringSubscription:
        RealtimeMetricsSubscriptionConfig:
          RealtimeMetricsSubscriptionStatus: Enabled
Outputs:
  DistributionId: {Value: !Ref Distribution}
  DomainName: {Value: !GetAtt Distribution.DomainName}
  StaticBucketName: {Condition: PrepareStaticBucket, Value: !Ref StaticBucket}
