AWSTemplateFormatVersion: '2010-09-09'
Description: Certificat public de démonstration validé dans la zone Route 53 déléguée.
Parameters:
  Domain:
    Type: String
  HostedZoneId:
    Type: String
Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref Domain
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref Domain
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - {Key: Projet, Value: SatomCloudNetwork}
        - {Key: Equipe, Value: bko}
Outputs:
  CertificateArn: {Value: !Ref Certificate}
