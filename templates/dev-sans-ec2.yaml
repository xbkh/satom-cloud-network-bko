AWSTemplateFormatVersion: '2010-09-09'
Description: Variante de validation dev ALB interne et Lambda lorsque le quota EC2 est saturé.
Parameters:
  VpcId: {Type: 'AWS::EC2::VPC::Id'}
  SubnetA: {Type: 'AWS::EC2::Subnet::Id'}
  SubnetB: {Type: 'AWS::EC2::Subnet::Id'}
Resources:
  AlbGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB interne accessible depuis la seule sonde
      VpcId: !Ref VpcId
  ProbeGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Sonde Lambda vers le seul ALB interne
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, DestinationSecurityGroupId: !Ref AlbGroup}
  ProbeToAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AlbGroup
      SourceSecurityGroupId: !Ref ProbeGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
  PortalRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess'
  ProbeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
  PortalLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /aws/lambda/satom-leman-ci-dev-portail-bko, RetentionInDays: 3}
  ProbeLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /aws/lambda/satom-leman-ci-dev-test-bko, RetentionInDays: 3}
  Portal:
    Type: AWS::Lambda::Function
    DependsOn: PortalLogs
    Properties:
      FunctionName: satom-leman-ci-dev-portail-bko
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt PortalRole.Arn
      Timeout: 5
      TracingConfig: {Mode: Active}
      Code:
        ZipFile: |
          # BEGIN APPLICATION
          """Service HTTP de démonstration de Léman Finance."""

          import base64
          import json
          import os
          import socket
          from dataclasses import dataclass
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from urllib.parse import urlsplit

          LOGO = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAIAAAAlC+aJAAAAZElEQVR4nO3PQQ3AIADA"
              "QEAEgrCD//9E8Lgs6Slo5z53/NnSAa8a0BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0"
              "BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0BrQGtAa0D4CBAFDmwGDrAAAAABJRU5ErkJggg=="
          )
          TEXT = "text/plain; charset=utf-8"
          HTML = "text/html; charset=utf-8"
          NO_CACHE = "no-store"
          SECURITY_HEADERS = {
              "X-Content-Type-Options": "nosniff",
              "Content-Security-Policy": "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'",
              "X-Frame-Options": "DENY",
              "Referrer-Policy": "no-referrer",
          }


          @dataclass(frozen=True)
          class PortalConfig:
              local_ip: str
              primary_web_ip: str
              app_ip: str
              diagnostics: bool = False


          def api_route(path, config):
              if path == "/api/health":
                  return 200, "app-01_bko OK"
              if config.diagnostics and path == "/api/error":
                  return 500, "Erreur applicative volontaire du TP"
              if config.diagnostics and path == "/api/flow-test":
                  try:
                      with socket.create_connection((config.primary_web_ip, 22), timeout=2):
                          return 200, "Connexion inattendue sur 22"
                  except OSError:
                      return 200, "Connexion au port 22 non établie"
              return 404, "Route API inconnue"


          def web_route(path, config):
              if path == "/health":
                  return 200, "healthy"
              if config.diagnostics and path == "/dns-test":
                  try:
                      result = socket.gethostbyname("app.prod.leman.internal")
                      return 200, f"app.prod.leman.internal = {result}"
                  except OSError:
                      return 503, "Zone DNS privée indisponible"
              if path == "/":
                  return 200, "web-01_bko" if config.local_ip == config.primary_web_ip else "web-02_bko"
              return 404, "Page inconnue"


          def home_content(node, accept):
              for item in accept.split(","):
                  media, *parameters = item.split(";")
                  if media.strip().lower() != "text/html":
                      continue
                  quality = "1"
                  for parameter in parameters:
                      key, _, value = parameter.partition("=")
                      if key.strip().lower() == "q":
                          quality = value
                          break
                  try:
                      if 0 < float(quality) <= 1:
                          break
                  except ValueError:
                      continue
              else:
                  return node + "\n", TEXT

              return f"""<!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Portail Léman Finance</title>
          </head>
          <body>
            <main>
              <h1>Portail Léman Finance</h1>
              <p>Serveur web <strong>{node}</strong></p>
              <p><a href="/api/health">Vérifier l’état de l’API</a></p>
            </main>
          </body>
          </html>
          """, HTML


          def make_server(address, config):
              is_app = config.local_ip == config.app_ip

              class Handler(BaseHTTPRequestHandler):
                  def version_string(self):
                      return "LemanPortal"

                  def do_HEAD(self):
                      self.do_GET()

                  def do_GET(self):
                      path = urlsplit(self.path).path
                      if not is_app and path == "/static/logo.png":
                          status, content, media_type, cache = 200, LOGO, "image/png", "public, max-age=86400"
                      else:
                          status, message = api_route(path, config) if is_app else web_route(path, config)
                          representation, media_type = message + "\n", TEXT
                          if not is_app and path == "/":
                              representation, media_type = home_content(message, self.headers.get("Accept", ""))
                          content, cache = representation.encode(), NO_CACHE
                      self.send_response(status)
                      self.send_header("Content-Type", media_type)
                      self.send_header("Cache-Control", cache)
                      if not is_app and path == "/":
                          self.send_header("Vary", "Accept")
                      self.send_header("Content-Length", str(len(content)))
                      for header, value in SECURITY_HEADERS.items():
                          self.send_header(header, value)
                      self.end_headers()
                      if self.command == "GET":
                          self.wfile.write(content)

                  def log_request(self, code="-", size="-"):
                      print(json.dumps({
                          "event": "http_request",
                          "method": self.command,
                          "status": code,
                          "path": urlsplit(self.path).path,
                      }), flush=True)

              return ThreadingHTTPServer(address, Handler)


          def main():
              config = PortalConfig(
                  local_ip=socket.gethostbyname(socket.gethostname()),
                  primary_web_ip=os.environ["LEMAN_WEB_IP"],
                  app_ip=os.environ["LEMAN_APP_IP"],
                  diagnostics=os.environ.get("LEMAN_LAB_DIAGNOSTICS") == "true",
              )
              port = 8080 if config.local_ip == config.app_ip else 80
              with make_server(("", port), config) as server:
                  server.serve_forever()

          from http import HTTPStatus


          DEMO = PortalConfig("Lambda dev", "Lambda dev", "Lambda dev")


          def handler(event, _context):
              path = urlsplit(event.get("path", "/")).path
              method = event.get("httpMethod", "GET")
              if method not in ("GET", "HEAD"):
                  status, message = 405, "Méthode non autorisée"
              elif path == "/static/logo.png":
                  status, message = 200, ""
              elif path.startswith("/api/"):
                  status, message = api_route(path, DEMO)
              else:
                  status, message = web_route(path, DEMO)
              binary = status == 200 and path == "/static/logo.png" and method == "GET"
              image = status == 200 and path == "/static/logo.png"
              body, media_type = message + "\n", TEXT
              if image:
                  media_type = "image/png"
                  if binary:
                      body = base64.b64encode(LOGO).decode("ascii")
              headers = {
                  **SECURITY_HEADERS,
                  "Content-Type": media_type,
                  "Cache-Control": "public, max-age=86400" if image else NO_CACHE,
              }
              if status == 200 and path == "/":
                  request_headers = {key.lower(): value for key, value in (event.get("headers") or {}).items()}
                  body, headers["Content-Type"] = home_content(message, request_headers.get("accept", ""))
                  headers["Vary"] = "Accept"
              print(json.dumps({"event": "http_request", "method": method, "status": status, "path": path}))
              return {
                  "statusCode": status,
                  "statusDescription": f"{status} {HTTPStatus(status).phrase}",
                  "headers": headers,
                  "isBase64Encoded": binary,
                  "body": "" if method == "HEAD" else body,
              }
          # END APPLICATION
  Probe:
    Type: AWS::Lambda::Function
    DependsOn: ProbeLogs
    Properties:
      FunctionName: satom-leman-ci-dev-test-bko
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ProbeRole.Arn
      Timeout: 60
      VpcConfig: {SubnetIds: [!Ref SubnetA, !Ref SubnetB], SecurityGroupIds: [!Ref ProbeGroup]}
      Environment:
        Variables:
          PORTAIL: !GetAtt Alb.DNSName
      Code:
        ZipFile: |
          import math, os, socket, time
          from urllib.error import HTTPError
          from urllib.request import urlopen
          HOST = os.environ["PORTAIL"]

          def get(path, method="GET"):
              from urllib.request import Request
              try:
                  with urlopen(Request("http://" + HOST + path, method=method), timeout=3) as response:
                      return response.status, response.read(), response.headers
              except HTTPError as error:
                  return error.code, error.read(), error.headers

          def quantile(samples, fraction):
              return round(sorted(samples)[math.ceil(len(samples) * fraction)-1], 2)

          def handler(event, _):
              started = time.monotonic()
              socket.getaddrinfo(HOST, 80)
              dns_ms = round((time.monotonic()-started)*1000, 2)
              status, message, _ = get("/")
              assert status == 200 and message.strip() == b"web-01_bko"
              status, body, headers = get("/api/health")
              assert status == 200 and b"app-01_bko OK" in body
              assert headers["Cache-Control"] == "no-store"
              assert headers["X-Content-Type-Options"] == "nosniff"
              assert get("/api/error")[0] == 404
              assert get("/static/logo.png", "HEAD")[2]["Content-Type"] == "image/png"
              if event.get("smoke_only") is True:
                  return {"dns_ms": dns_ms, "http_home": 200, "http_api": 200, "diagnostic": 404}
              samples, errors = [], 0
              paths = ("/", "/api/health", "/static/logo.png")
              for index in range(60):
                  started = time.monotonic()
                  try:
                      errors += get(paths[index % 3])[0] != 200
                  except OSError:
                      errors += 1
                  elapsed = time.monotonic() - started
                  samples.append(elapsed * 1000)
                  time.sleep(max(0, 0.2-elapsed))
              p95, p99 = quantile(samples,0.95), quantile(samples,0.99)
              return {"n":60, "max_req_s":5, "errors":errors, "dns_ms":dns_ms, "p95_ms":p95,
                      "p99_ms":p99, "http_api":200, "diagnostic":404, "headers_passifs":"OK",
                      "thresholds":dns_ms<100 and p95<500 and p99<1000 and errors/60<0.005}
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      Subnets: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroups: [!Ref AlbGroup]
  Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Portal
      Action: lambda:InvokeFunction
      Principal: elasticloadbalancing.amazonaws.com
      SourceAccount: !Ref 'AWS::AccountId'
      SourceArn: !Sub 'arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:targetgroup/*'
  Targets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: Permission
    Properties:
      Name: tg-satom-ci-lambda-bko
      TargetType: lambda
      Targets: [{Id: !GetAtt Portal.Arn}]
  Http:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref Targets}]
Outputs:
  ProbeName: {Value: !Ref Probe}
