AWSTemplateFormatVersion: '2010-09-09'
Description: Identité SSM de la sonde de cours.
Resources:
  ProbeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
  ProbeProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ProbeRole]
Outputs:
  ProbeProfileName: {Value: !Ref ProbeProfile}
  ProbeRoleArn: {Value: !GetAtt ProbeRole.Arn}
