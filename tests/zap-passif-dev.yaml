env:
  contexts:
    - name: portail-dev
      urls: [http://127.0.0.1:18741]
  parameters:
    failOnError: true
jobs:
  - type: passiveScan-config
    parameters:
      scanOnlyInScope: true
  - type: requestor
    requests:
      - url: http://127.0.0.1:18741/
        method: GET
        headers: ["Accept: text/html"]
        responseCode: 200
      - url: http://127.0.0.1:18741/api/health
        method: GET
        responseCode: 200
      - url: http://127.0.0.1:18741/static/logo.png
        method: GET
        responseCode: 200
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: report
    parameters:
      template: traditional-json
      reportDir: .
      reportFile: zap-passif-dev
      reportTitle: Analyse passive des réponses du portail de test
